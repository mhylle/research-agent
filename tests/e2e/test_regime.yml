              expect_suggestion: true
            - text: "Where is the Eiffel Tower?"
              expect_suggestion: true
            - text: "How many planets are in our solar system?"
              expect_suggestion: true
            - text: "Hello, how are you?"
              expect_suggestion: false
          flexibility: ai_judgment
      success_criteria:
