# =============================================================================
# TEST EXECUTION CONFIGURATION
# =============================================================================
execution:
  parallel: false  # Run tests sequentially for reliability
  retry_failed: 2  # Retry failed tests up to 2 times
  screenshot_on_failure: true
  video_recording: false
  timeout_defaults:
    navigation: 10000
    action: 5000
    assertion: 3000
    streaming: 120000

  environments:
    local:
      base_url: http://localhost:4200
      api_url: http://localhost:3000

  browsers:
    - chromium
    # - firefox  # Optional
    # - webkit   # Optional

  reports:
    output_dir: tests/e2e/reports
    formats:
      - html
      - json
    evidence_dir: tests/e2e/evidence
