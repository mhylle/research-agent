# =============================================================================
# COMPREHENSIVE CHAT FUNCTIONALITY TESTS
# Extended test coverage for chat features, edge cases, and integrations
# =============================================================================
chat_comprehensive:
  description: Comprehensive chat functionality testing including edge cases and advanced features

  scenarios:
    # ---------------------------------------------------------------------------
    # MESSAGE FLOW & STATE MANAGEMENT
    # ---------------------------------------------------------------------------
    - id: CHAT-MSG-001
      name: Message Send Flow Complete Cycle
      description: |
        Full message lifecycle:
        1. User types message
        2. Send button enables
        3. Click send
        4. User message appears immediately
        5. Assistant placeholder appears
        6. Streaming begins
        7. Streaming completes
        8. Final message displayed
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: 'button "Create new chat"'
        - action: wait_for
          condition: conversation_created
          timeout: 5000
        - action: verify_button_state
          element: 'button "Send message"'
          expected: disabled
        - action: type
          element: 'textbox "Message input"'
          text: "Hello, tell me a quick fact about TypeScript"
        - action: verify_button_state
          element: 'button "Send message"'
          expected: enabled
        - action: click
          element: 'button "Send message"'
        - action: verify
          condition: user_message_appears_immediately
          flexibility: ai_judgment
        - action: verify
          condition: input_field_cleared
          flexibility: exact
        - action: wait_for
          condition: assistant_message_streaming_starts
          timeout: 10000
        - action: wait_for
          condition: streaming_complete
          timeout: 120000
        - action: verify
          condition: assistant_message_has_content
          flexibility: ai_judgment
      success_criteria:
        - type: complete_message_flow
          flexibility: ai_judgment
          description: Message should go through complete send->receive cycle

    - id: CHAT-MSG-002
      name: Consecutive Messages Same Conversation
      description: Send multiple messages in quick succession
      preconditions:
        - Active conversation exists
      steps:
        - action: navigate
          url: /chat/:conversationId
        - action: type
          element: 'textbox "Message input"'
          text: "First message"
        - action: click
          element: 'button "Send message"'
        - action: wait_for
          condition: streaming_complete
          timeout: 60000
        - action: type
          element: 'textbox "Message input"'
          text: "Second message"
        - action: click
          element: 'button "Send message"'
        - action: wait_for
          condition: streaming_complete
          timeout: 60000
        - action: verify
          condition: message_order_preserved
          flexibility: ai_judgment
          description: Messages should appear in correct chronological order
        - action: verify
          condition: four_messages_visible
          flexibility: ai_judgment
          description: 2 user + 2 assistant messages
      success_criteria:
        - type: consecutive_messages_work
          flexibility: ai_judgment

    - id: CHAT-MSG-003
      name: Message Persistence After Navigation
      description: Messages should persist after navigating away and back
      preconditions:
        - Conversation with messages exists
      steps:
        - action: navigate
          url: /chat/:conversationId
        - action: count_messages
          store_as: initial_count
        - action: navigate
          url: /logs
        - action: wait_for
          timeout: 1000
        - action: navigate
          url: /chat/:conversationId
        - action: count_messages
          store_as: after_nav_count
        - action: verify
          condition: initial_count == after_nav_count
          flexibility: exact
      success_criteria:
        - type: messages_persist
          flexibility: exact

    - id: CHAT-MSG-004
      name: Empty Message Prevention
      description: Verify empty/whitespace messages cannot be sent
      steps:
        - action: navigate
          url: /chat
        - action: type
          element: 'textbox "Message input"'
          text: "   "
        - action: verify_button_state
          element: 'button "Send message"'
          expected: disabled
          flexibility: exact
        - action: press_key
          key: Control+Enter
        - action: verify
          condition: no_message_sent
          flexibility: ai_judgment
      success_criteria:
        - type: empty_blocked
          flexibility: exact

    - id: CHAT-MSG-005
      name: Very Long Message Handling
      description: Handle long messages without UI breakage
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: 'button "Create new chat"'
        - action: type
          element: 'textbox "Message input"'
          text: "This is a very long message that tests the application's ability to handle extended content. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. This test continues with more content to ensure the system handles lengthy inputs properly without breaking the layout or causing performance issues."
        - action: verify
          condition: textarea_expands_appropriately
          flexibility: ai_judgment
        - action: click
          element: 'button "Send message"'
        - action: wait_for
          condition: message_sent
          timeout: 5000
        - action: verify
          condition: long_message_displayed_properly
          flexibility: ai_judgment
      success_criteria:
        - type: long_message_works
          flexibility: ai_judgment

    - id: CHAT-MSG-006
      name: Special Characters in Messages
      description: Handle special characters, emojis, and unicode
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: 'button "Create new chat"'
        - action: type
          element: 'textbox "Message input"'
          text: "Test with special chars: <script>alert('xss')</script> & \"quotes\" 'apostrophes' emoji: 🎉🚀 unicode: äöü 中文 العربية"
        - action: click
          element: 'button "Send message"'
        - action: wait_for
          condition: message_displayed
          timeout: 5000
        - action: verify
          condition: special_chars_escaped_properly
          flexibility: ai_judgment
          description: XSS should be prevented, emojis/unicode should display
      success_criteria:
        - type: special_chars_handled
          flexibility: ai_judgment

    - id: CHAT-MSG-007
      name: Multiline Message Preservation
      description: Newlines in messages should be preserved
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: 'button "Create new chat"'
        - action: type
          element: 'textbox "Message input"'
          text: "Line 1"
        - action: press_key
          key: Shift+Enter
        - action: type
          element: 'textbox "Message input"'
          text: "Line 2"
        - action: press_key
          key: Shift+Enter
        - action: type
          element: 'textbox "Message input"'
          text: "Line 3"
        - action: click
          element: 'button "Send message"'
        - action: wait_for
          condition: message_displayed
          timeout: 5000
        - action: verify
          condition: newlines_preserved_in_display
          flexibility: ai_judgment
          description: Message should show 3 separate lines
      success_criteria:
        - type: multiline_preserved
          flexibility: ai_judgment

    # ---------------------------------------------------------------------------
    # CONVERSATION LIFECYCLE ADVANCED TESTS
    # ---------------------------------------------------------------------------
    - id: CHAT-CONV-001
      name: Conversation Title Auto-Generation
      description: |
        Per code: "Title from first message: extractTitleFromMessage takes first 50 chars"
      steps:
        - action: navigate
          url: /chat
        - action: type
          element: 'textbox "Message input"'
          text: "What are the main differences between React and Angular frameworks?"
        - action: click
          element: 'button "Send message"'
        - action: wait_for
          condition: conversation_created
          timeout: 5000
        - action: verify
          condition: conversation_title_contains_message_text
          flexibility: ai_judgment
          description: Title should derive from first message content
      success_criteria:
        - type: auto_title_works
          flexibility: ai_judgment

    - id: CHAT-CONV-002
      name: Conversation URL Routing
      description: Direct navigation to conversation via URL
      preconditions:
        - Conversation with ID exists
      steps:
        - action: navigate
          url: /chat/:conversationId
        - action: verify_url
          expected: /chat/:conversationId
          flexibility: contains
        - action: verify
          condition: conversation_messages_loaded
          flexibility: ai_judgment
        - action: verify
          condition: conversation_selected_in_sidebar
          flexibility: ai_judgment
      success_criteria:
        - type: url_routing_works
          flexibility: ai_judgment

    - id: CHAT-CONV-003
      name: Switch Between Conversations
      description: Switching conversations loads correct messages
      preconditions:
        - At least 2 conversations with distinct messages exist
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: 'first conversation in list'
        - action: verify
          condition: first_conversation_messages_displayed
          flexibility: ai_judgment
        - action: click
          element: 'second conversation in list'
        - action: verify
          condition: second_conversation_messages_displayed
          flexibility: ai_judgment
          description: Messages should completely change when switching
      success_criteria:
        - type: conversation_switch_works
          flexibility: ai_judgment

    - id: CHAT-CONV-004
      name: Delete Current Conversation Navigation
      description: |
        Per code: "If current conversation deleted, navigate to /chat and clear"
      preconditions:
        - Active conversation selected
      steps:
        - action: navigate
          url: /chat/:conversationId
        - action: click
          element: 'delete button for current conversation'
        - action: handle_confirm_dialog
          accept: true
        - action: wait_for
          condition: conversation_deleted
          timeout: 5000
        - action: verify_url
          expected: /chat
          flexibility: exact
          description: Should navigate back to /chat without ID
        - action: verify
          condition: empty_state_or_welcome_displayed
          flexibility: ai_judgment
      success_criteria:
        - type: delete_navigation_works
          flexibility: ai_judgment

    - id: CHAT-CONV-005
      name: Delete Non-Current Conversation
      description: Deleting conversation that isn't selected
      preconditions:
        - At least 2 conversations exist
      steps:
        - action: navigate
          url: /chat/:conversationId1
        - action: click
          element: 'delete button for second conversation (not current)'
        - action: handle_confirm_dialog
          accept: true
        - action: wait_for
          condition: conversation_deleted
          timeout: 5000
        - action: verify_url
          expected: /chat/:conversationId1
          flexibility: contains
          description: Should remain on current conversation
        - action: verify
          condition: current_messages_still_displayed
          flexibility: ai_judgment
      success_criteria:
        - type: non_current_delete_works
          flexibility: ai_judgment

    - id: CHAT-CONV-006
      name: Delete Confirmation Cancel
      description: Cancel delete should not remove conversation
      preconditions:
        - At least 1 conversation exists
      steps:
        - action: navigate
          url: /chat
        - action: count_conversations
          store_as: initial_count
        - action: click
          element: 'delete button for first conversation'
        - action: handle_confirm_dialog
          accept: false
        - action: count_conversations
          store_as: after_cancel_count
        - action: verify
          condition: initial_count == after_cancel_count
          flexibility: exact
      success_criteria:
        - type: cancel_preserves_conversation
          flexibility: exact

    - id: CHAT-CONV-007
      name: Search Conversations Debounce
      description: |
        Per code: "Debounce search with 300ms timeout"
      steps:
        - action: navigate
          url: /chat
        - action: type
          element: 'searchbox "Search conversations"'
          text: "t"
        - action: type_quickly
          element: 'searchbox "Search conversations"'
          text: "est"
          delay_between_chars: 50
        - action: wait_for
          timeout: 500
        - action: verify
          condition: single_search_request_made
          flexibility: ai_judgment
          description: Should debounce rapid typing
      success_criteria:
        - type: search_debounced
          flexibility: ai_judgment

    - id: CHAT-CONV-008
      name: Search Clear Reloads All
      description: |
        Per code: "If search cleared, reload all conversations"
      preconditions:
        - Multiple conversations exist
      steps:
        - action: navigate
          url: /chat
        - action: type
          element: 'searchbox "Search conversations"'
          text: "specific search term"
        - action: wait_for
          condition: search_filtered
          timeout: 2000
        - action: clear
          element: 'searchbox "Search conversations"'
        - action: wait_for
          timeout: 500
        - action: verify
          condition: all_conversations_visible
          flexibility: ai_judgment
      success_criteria:
        - type: clear_reloads_all
          flexibility: ai_judgment

    - id: CHAT-CONV-009
      name: Token Count Display
      description: Conversations should show token count
      preconditions:
        - Conversation with messages exists
      steps:
        - action: navigate
          url: /chat
        - action: verify_elements
          elements:
            - selector: 'token count indicator on conversation'
              expected: visible
              flexibility: ai_judgment
              description: Should show "X tokens" on conversation item
      success_criteria:
        - type: token_count_visible
          flexibility: ai_judgment

    # ---------------------------------------------------------------------------
    # STREAMING & REAL-TIME TESTS
    # ---------------------------------------------------------------------------
    - id: CHAT-STREAM-001
      name: Streaming Content Updates
      description: Content should update progressively during streaming
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: 'button "Create new chat"'
        - action: type
          element: 'textbox "Message input"'
          text: "Write a paragraph about the history of computing"
        - action: click
          element: 'button "Send message"'
        - action: wait_for
          condition: streaming_starts
          timeout: 10000
        - action: capture_streaming_content
          store_as: content_snapshot_1
        - action: wait_for
          timeout: 2000
        - action: capture_streaming_content
          store_as: content_snapshot_2
        - action: verify
          condition: content_snapshot_2 longer than content_snapshot_1
          flexibility: ai_judgment
          description: Content should grow during streaming
      success_criteria:
        - type: progressive_streaming
          flexibility: ai_judgment

    - id: CHAT-STREAM-002
      name: Streaming State Indicators
      description: |
        Per code: "connectionStatus states: disconnected, connecting, connected, error"
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: 'button "Create new chat"'
        - action: type
          element: 'textbox "Message input"'
          text: "Hello"
        - action: click
          element: 'button "Send message"'
        - action: verify
          condition: connection_status_indicator_visible
          flexibility: ai_judgment
        - action: wait_for
          condition: streaming_complete
          timeout: 60000
      success_criteria:
        - type: status_indicators_work
          flexibility: ai_judgment

    - id: CHAT-STREAM-003
      name: Input Disabled During Streaming
      description: Input should be disabled while response is streaming
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: 'button "Create new chat"'
        - action: type
          element: 'textbox "Message input"'
          text: "Tell me about artificial intelligence in detail"
        - action: click
          element: 'button "Send message"'
        - action: wait_for
