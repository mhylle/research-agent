# E2E Test Regime for Research Agent
# Generated: 2025-12-10
# Based on: docs/plans/2025-01-09-chat-with-research-addon.md
# Application URL: http://localhost:4200

metadata:
  name: Research Agent E2E Test Suite
  version: "1.0.0"
  description: Comprehensive E2E tests for chat-first research application
  base_url: http://localhost:4200
  prerequisites:
    - PostgreSQL running with migrations applied
    - Backend server running on port 3000
    - Frontend server running on port 4200
    - Ollama or Azure Mistral LLM configured

# =============================================================================
# NAVIGATION TESTS
# =============================================================================
navigation:
  description: Test application navigation and routing

  scenarios:
    - id: NAV-001
      name: Header Navigation Links
      description: Verify all navigation links in the header are present and functional
      steps:
        - action: navigate
          url: /
        - action: verify_elements
          elements:
            - selector: 'link "Research Agent"'
              ref: e6
              expected: visible
              flexibility: exact
            - selector: 'link "Research"'
              ref: e8
              expected: visible
              flexibility: exact
            - selector: 'link "Chat"'
              ref: e9
              expected: visible
              flexibility: exact
            - selector: 'link "Logs"'
              ref: e10
              expected: visible
              flexibility: exact
            - selector: 'link "Evaluations"'
              ref: e11
              expected: visible
              flexibility: exact
      success_criteria:
        - type: elements_visible
          flexibility: exact
          description: All navigation links must be visible

    - id: NAV-002
      name: Navigate to Chat Page
      description: Click Chat link and verify chat page loads
      steps:
        - action: navigate
          url: /
        - action: click
          element: 'link "Chat"'
          ref: e9
        - action: verify_url
          expected: /chat
          flexibility: exact
        - action: verify_elements
          elements:
            - selector: 'heading "Conversations"'
              expected: visible
            - selector: 'button "Create new chat"'
              expected: visible
            - selector: 'textbox "Message input"'
              expected: visible
      success_criteria:
        - type: url_match
          flexibility: exact
        - type: elements_visible
          flexibility: exact

    - id: NAV-003
      name: Navigate to Logs Page
      description: Click Logs link and verify logs page loads
      steps:
        - action: navigate
          url: /
        - action: click
          element: 'link "Logs"'
        - action: verify_url
          expected: /logs
          flexibility: exact
        - action: verify_elements
          elements:
            - selector: 'searchbox "Search sessions"'
              expected: visible
      success_criteria:
        - type: url_match
          flexibility: exact

    - id: NAV-004
      name: Navigate to Evaluation Dashboard
      description: Click Evaluations link and verify dashboard loads
      steps:
        - action: navigate
          url: /
        - action: click
          element: 'link "Evaluations"'
        - action: verify_url
          expected: /evaluation-dashboard
          flexibility: exact
      success_criteria:
        - type: url_match
          flexibility: exact

    - id: NAV-005
      name: Logo Returns to Home
      description: Clicking the logo should return to the research page
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: 'link "Research Agent"'
        - action: verify_url
          expected: /
          flexibility: exact
      success_criteria:
        - type: url_match
          flexibility: exact

# =============================================================================
# CHAT LAYOUT TESTS
# Based on: docs/brainstorms/2025-01-09-chat-with-research-addon.md
# =============================================================================
chat_layout:
  description: Verify chat page layout matches design specifications

  scenarios:
    - id: CHAT-LAYOUT-001
      name: Chat Page Initial Layout
      description: |
        Verify the chat page has the correct layout structure:
        - Sidebar with conversation list on the left
        - Main chat area in the center
        - Research side panel (when open) on the right
      steps:
        - action: navigate
          url: /chat
        - action: verify_layout
          checks:
            - element: 'navigation "Conversation navigation"'
              position: left_sidebar
              expected: visible
              flexibility: exact
            - element: 'main'
              position: center
              expected: visible
              flexibility: exact
            - element: 'heading "Welcome to Research Agent"'
              expected: visible
              flexibility: exact
              context: Empty state when no conversation selected
      success_criteria:
        - type: layout_structure
          flexibility: ai_judgment
          description: Layout should have sidebar on left, main area center

    - id: CHAT-LAYOUT-002
      name: Sidebar Components
      description: |
        Per design doc (Component 5: Chat UI):
        - ConversationListComponent - sidebar with conversation history, search, new/delete
      steps:
        - action: navigate
          url: /chat
        - action: verify_elements
          elements:
            - selector: 'heading "Conversations"'
              expected: visible
              flexibility: exact
              description: Sidebar header
            - selector: 'button "Create new chat"'
              expected: visible
              flexibility: exact
              description: New conversation button with + icon
            - selector: 'searchbox "Search conversations"'
              expected: visible
              flexibility: exact
              description: Search/filter input for conversations
      success_criteria:
        - type: all_elements_present
          flexibility: exact

    - id: CHAT-LAYOUT-003
      name: Empty State Display
      description: |
        When no conversation is selected, show welcome message and empty conversation list
      steps:
        - action: navigate
          url: /chat
        - action: verify_elements
          elements:
            - selector: 'status with text "No conversations yet"'
              expected: visible
              flexibility: contains
              description: Empty list message
            - selector: 'text "Click "New Chat" to start your first conversation"'
              expected: visible
              flexibility: contains
              description: Hint for new users
            - selector: 'heading "Welcome to Research Agent"'
              expected: visible
              flexibility: exact
              description: Main area empty state
      success_criteria:
        - type: empty_state_displayed
          flexibility: exact

    - id: CHAT-LAYOUT-004
      name: Chat Input Component Structure
      description: |
        Per design doc (ChatInputComponent):
        - Textarea with auto-resize
        - Research toggle button
        - Send button (disabled when empty)
        - Keyboard shortcuts hint
      steps:
        - action: navigate
          url: /chat
        - action: verify_elements
          elements:
            - selector: 'form "Message input form"'
              expected: visible
              flexibility: exact
            - selector: 'textbox "Message input"'
              expected: visible
              flexibility: exact
              attributes:
                placeholder: "Type a message..."
            - selector: 'button with aria-label containing "research"'
              expected: visible
              flexibility: contains
              description: Research toggle button
            - selector: 'button "Send message"'
              expected: visible
              flexibility: exact
              attributes:
                disabled: true
              description: Send button disabled when empty
            - selector: 'note "Keyboard shortcuts"'
              expected: visible
              flexibility: exact
            - selector: 'text "Ctrl+Enter to send"'
              expected: visible
              flexibility: contains
            - selector: 'text "Shift+Enter for newline"'
              expected: visible
              flexibility: contains
      success_criteria:
        - type: all_elements_present
          flexibility: exact

# =============================================================================
# CONVERSATION MANAGEMENT TESTS
# =============================================================================
conversation_management:
  description: Test conversation CRUD operations

  scenarios:
    - id: CONV-001
      name: Create New Conversation
      description: |
        Test creating a new conversation:
        1. Click "New Chat" button
        2. Verify conversation appears in list
        3. Verify conversation is selected
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: 'button "Create new chat"'
        - action: wait_for
          condition: conversation_list_updated
          timeout: 5000
        - action: verify_elements
          elements:
            - selector: 'conversation list item'
              expected: at_least_one
              flexibility: ai_judgment
      success_criteria:
        - type: conversation_created
          flexibility: ai_judgment
          description: New conversation should appear in the sidebar list

    - id: CONV-002
      name: Create Conversation via First Message
      description: |
        Per design: "If no conversation is selected, create one first"
        Type a message when no conversation exists to auto-create one
      steps:
        - action: navigate
          url: /chat
        - action: type
          element: 'textbox "Message input"'
          text: "Hello, this is a test message"
        - action: verify_button_state
          element: 'button "Send message"'
          expected: enabled
          flexibility: exact
        - action: click
          element: 'button "Send message"'
        - action: wait_for
          condition: conversation_created_and_message_sent
          timeout: 10000
      success_criteria:
        - type: conversation_created
          flexibility: ai_judgment
        - type: message_sent
          flexibility: ai_judgment

    - id: CONV-003
      name: Search Conversations
      description: Test conversation search functionality
      preconditions:
        - At least one conversation exists with known title
      steps:
        - action: navigate
          url: /chat
        - action: type
          element: 'searchbox "Search conversations"'
          text: "test"
        - action: wait_for
          condition: search_results_updated
          timeout: 2000
        - action: verify
          condition: filtered_results
          flexibility: ai_judgment
      success_criteria:
        - type: search_filters_results
          flexibility: ai_judgment

    - id: CONV-004
      name: Delete Conversation
      description: |
        Test conversation deletion:
        1. Find delete button on conversation item
        2. Click delete
        3. Verify conversation removed from list
      preconditions:
        - At least one conversation exists
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: 'conversation delete button'
          description: Delete button with X icon on conversation item
        - action: wait_for
          condition: conversation_deleted
          timeout: 5000
        - action: verify
          condition: conversation_removed_from_list
          flexibility: ai_judgment
      success_criteria:
        - type: conversation_deleted
          flexibility: ai_judgment

    - id: CONV-005
      name: Select Existing Conversation
      description: |
        Click on a conversation to load it:
        - URL updates to /chat/:conversationId
        - Messages load in chat thread
        - Conversation title shown in header
      preconditions:
        - At least one conversation with messages exists
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: 'conversation list item'
        - action: verify_url
          expected: /chat/:id
          flexibility: contains
        - action: verify_elements
          elements:
            - selector: 'chat thread with messages'
              expected: visible
              flexibility: ai_judgment
      success_criteria:
        - type: conversation_loaded
          flexibility: ai_judgment

# =============================================================================
# CHAT INPUT TESTS
# =============================================================================
chat_input:
  description: Test chat input functionality

  scenarios:
    - id: INPUT-001
      name: Send Button State Management
      description: |
        Per design doc: "Send button (disabled when empty or loading)"
      steps:
        - action: navigate
          url: /chat
        - action: verify_button_state
          element: 'button "Send message"'
          expected: disabled
          flexibility: exact
          description: Initially disabled (empty input)
        - action: type
          element: 'textbox "Message input"'
          text: "Test message"
        - action: verify_button_state
          element: 'button "Send message"'
          expected: enabled
          flexibility: exact
          description: Enabled when text entered
        - action: clear
          element: 'textbox "Message input"'
        - action: verify_button_state
          element: 'button "Send message"'
          expected: disabled
          flexibility: exact
          description: Disabled again when cleared
      success_criteria:
        - type: button_state_correct
          flexibility: exact

    - id: INPUT-002
      name: Research Toggle Default State
      description: |
        Per design doc: "Toggle state: Resets to OFF after each message (explicit opt-in)"
      steps:
        - action: navigate
          url: /chat
        - action: verify_toggle_state
          element: 'button with aria-label containing "research"'
          expected: off
          flexibility: exact
          description: Research toggle defaults to OFF
      success_criteria:
        - type: toggle_default_off
          flexibility: exact

    - id: INPUT-003
      name: Research Toggle Activation
      description: Test toggling research mode on and off
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: 'button with aria-label "Enable research mode for web search"'
        - action: verify_toggle_state
          element: research_toggle
          expected: on
          flexibility: exact
          description: Toggle shows active state
        - action: verify_aria
          element: research_toggle
          attribute: aria-pressed
          expected: "true"
          flexibility: exact
        - action: click
          element: research_toggle
        - action: verify_toggle_state
          element: research_toggle
          expected: off
          flexibility: exact
      success_criteria:
        - type: toggle_functional
          flexibility: exact

    - id: INPUT-004
      name: Research Toggle Resets After Send
      description: |
        Per design doc: "Toggle resets to OFF after each message sent"
      preconditions:
        - Conversation exists or will be created
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: research_toggle
          description: Enable research mode
        - action: type
          element: 'textbox "Message input"'
          text: "Test message with research"
        - action: click
          element: 'button "Send message"'
        - action: wait_for
          condition: message_sent
          timeout: 5000
        - action: verify_toggle_state
          element: research_toggle
          expected: off
          flexibility: exact
          description: Toggle resets to OFF after send
      success_criteria:
        - type: toggle_resets
          flexibility: exact

    - id: INPUT-005
      name: Keyboard Shortcut Ctrl+Enter
      description: |
        Per design doc: "Ctrl+Enter to send"
      steps:
        - action: navigate
          url: /chat
        - action: type
          element: 'textbox "Message input"'
          text: "Message sent via keyboard"
        - action: press_key
          key: Control+Enter
        - action: wait_for
          condition: message_sent
          timeout: 5000
      success_criteria:
        - type: keyboard_shortcut_works
          flexibility: ai_judgment

    - id: INPUT-006
      name: Keyboard Shortcut Shift+Enter for Newline
      description: |
        Per design doc: "Shift+Enter for newline"
      steps:
        - action: navigate
          url: /chat
        - action: type
          element: 'textbox "Message input"'
          text: "Line 1"
        - action: press_key
          key: Shift+Enter
        - action: type
          element: 'textbox "Message input"'
          text: "Line 2"
        - action: verify_input_value
          element: 'textbox "Message input"'
          expected: "Line 1\nLine 2"
          flexibility: contains
      success_criteria:
        - type: multiline_input_works
          flexibility: ai_judgment

    - id: INPUT-007
      name: Textarea Auto-resize
      description: |
        Per design doc: "Textarea with auto-resize"
      steps:
        - action: navigate
          url: /chat
        - action: get_element_height
          element: 'textbox "Message input"'
          store_as: initial_height
        - action: type
          element: 'textbox "Message input"'
          text: "Line 1\nLine 2\nLine 3\nLine 4\nLine 5"
        - action: get_element_height
          element: 'textbox "Message input"'
          store_as: expanded_height
        - action: verify
          condition: expanded_height > initial_height
          flexibility: ai_judgment
      success_criteria:
        - type: textarea_expands
          flexibility: ai_judgment

# =============================================================================
# CHAT THREAD TESTS
# =============================================================================
chat_thread:
  description: Test chat message display and streaming

  scenarios:
    - id: THREAD-001
      name: Message Display Structure
      description: |
        Per design doc (ChatThreadComponent):
        - Display messages with role-based styling (user right, assistant left)
        - Render markdown content
        - Show timestamps
      preconditions:
        - Conversation with at least one user and assistant message
      steps:
        - action: navigate
          url: /chat/:conversationId
        - action: verify_elements
          elements:
            - selector: 'chat thread messages container'
              expected: visible
              flexibility: ai_judgment
            - selector: 'user message'
              expected: visible
              css_class_contains: message--user
              flexibility: ai_judgment
            - selector: 'assistant message'
              expected: visible
              css_class_contains: message--assistant
              flexibility: ai_judgment
            - selector: 'message timestamp'
              expected: visible
              flexibility: ai_judgment
      success_criteria:
        - type: messages_styled_correctly
          flexibility: ai_judgment

    - id: THREAD-002
      name: Markdown Rendering in Messages
      description: |
        Assistant messages should render markdown (headings, lists, code blocks, links)
      preconditions:
        - Conversation with markdown content in assistant response
      steps:
        - action: navigate
          url: /chat/:conversationId
        - action: verify
          condition: markdown_rendered_to_html
          flexibility: ai_judgment
          description: Check that markdown elements are rendered (e.g., <h1>, <ul>, <code>)
      success_criteria:
        - type: markdown_rendered
          flexibility: ai_judgment

    - id: THREAD-003
      name: Streaming Response Display
      description: |
        Per design doc: "Show loading indicator during LLM streaming"
        - Tokens stream in real-time
        - Typing indicator shown initially
      preconditions:
        - Ability to send message and receive streaming response
      steps:
        - action: navigate
          url: /chat
        - action: type
          element: 'textbox "Message input"'
          text: "Tell me a short joke"
        - action: click
          element: 'button "Send message"'
        - action: wait_for
          condition: streaming_indicator_visible
          timeout: 3000
        - action: verify_elements
          elements:
            - selector: 'typing indicator dots or streaming content'
              expected: visible
              flexibility: ai_judgment
        - action: wait_for
          condition: streaming_complete
          timeout: 60000
        - action: verify
          condition: assistant_message_displayed
          flexibility: ai_judgment
      success_criteria:
        - type: streaming_works
          flexibility: ai_judgment

    - id: THREAD-004
      name: Auto-scroll to New Messages
      description: |
        Per design doc: "Auto-scroll to bottom on new messages"
      preconditions:
        - Conversation with enough messages to require scrolling
      steps:
        - action: navigate
          url: /chat/:conversationId
        - action: scroll_to_top
          element: chat_thread_container
        - action: type
          element: 'textbox "Message input"'
          text: "New message to trigger scroll"
        - action: click
          element: 'button "Send message"'
        - action: wait_for
          condition: message_sent
          timeout: 5000
        - action: verify
          condition: scrolled_to_bottom
          flexibility: ai_judgment
      success_criteria:
        - type: auto_scroll_works
          flexibility: ai_judgment

    - id: THREAD-005
      name: Empty Thread State
      description: When conversation has no messages, show empty state
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: 'button "Create new chat"'
        - action: wait_for
          condition: new_conversation_created
          timeout: 5000
        - action: verify_elements
          elements:
            - selector: 'empty thread indicator'
              expected: visible
              flexibility: ai_judgment
              description: "No messages yet" or similar
      success_criteria:
        - type: empty_state_shown
          flexibility: ai_judgment

# =============================================================================
# RESEARCH INTEGRATION TESTS
# Based on: Design doc Phase 6 - Research Integration Layer
# =============================================================================
research_integration:
  description: Test research mode with chat integration

  scenarios:
    - id: RESEARCH-001
      name: Send Message with Research Enabled
      description: |
        Per design doc:
        - Research trigger: User must submit a message with research enabled
        - Research pipeline called with contextualized query
        - Side panel opens with research progress
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: research_toggle
          description: Enable research mode
        - action: verify_toggle_state
          element: research_toggle
          expected: on
        - action: type
          element: 'textbox "Message input"'
          text: "What is the latest version of Angular?"
        - action: click
          element: 'button "Send message"'
        - action: wait_for
          condition: research_started
          timeout: 5000
        - action: verify_elements
          elements:
            - selector: 'research side panel'
              expected: visible
              flexibility: ai_judgment
            - selector: 'research progress indicator'
              expected: visible
              flexibility: ai_judgment
        - action: wait_for
          condition: research_complete
          timeout: 120000
        - action: verify
          condition: citations_displayed
          flexibility: ai_judgment
      success_criteria:
        - type: research_executes
          flexibility: ai_judgment
        - type: citations_shown
          flexibility: ai_judgment

    - id: RESEARCH-002
      name: Research Side Panel Structure
      description: |
        Per design doc (ResearchSidePanelComponent):
        - Collapsible panel
        - Sources list with title, URL, snippet
        - Research progress indicator
        - Close button
      preconditions:
        - Research completed with citations
      steps:
        - action: navigate
          url: /chat/:conversationId
        - action: open_research_panel
        - action: verify_elements
          elements:
            - selector: 'heading "Sources"'
              expected: visible
              flexibility: exact
            - selector: 'close button'
              expected: visible
              flexibility: ai_judgment
            - selector: 'source list items'
              expected: at_least_one
              flexibility: ai_judgment
              contains:
                - title
                - url
                - snippet
      success_criteria:
        - type: panel_structure_correct
          flexibility: ai_judgment

    - id: RESEARCH-003
      name: Citation Click Opens Panel
      description: |
        Per design doc: "Clickable - opens side panel and highlights source"
      preconditions:
        - Message with citations exists
      steps:
        - action: navigate
          url: /chat/:conversationId
        - action: click
          element: 'inline citation [1]'
        - action: verify_elements
          elements:
            - selector: 'research side panel'
              expected: visible
              flexibility: ai_judgment
            - selector: 'highlighted citation'
              expected: visible
              flexibility: ai_judgment
      success_criteria:
        - type: citation_click_works
          flexibility: ai_judgment

    - id: RESEARCH-004
      name: Research Progress Stages
      description: |
        Per design doc: Show stages: Query Analysis -> Source Selection -> Answer Synthesis
      steps:
        - action: navigate
          url: /chat
        - action: click
          element: research_toggle
        - action: type
          element: 'textbox "Message input"'
          text: "What are the latest JavaScript frameworks?"
        - action: click
          element: 'button "Send message"'
        - action: verify_sequence
          stages:
            - name: research_started
              description: Research begins
            - name: progress_visible
              description: Progress bar or stage indicator visible
            - name: research_complete
              description: Research finishes, answer displays
          flexibility: ai_judgment
      success_criteria:
        - type: stages_shown
          flexibility: ai_judgment

    - id: RESEARCH-005
      name: Close Research Panel
      description: Test closing the research side panel
      preconditions:
        - Research panel is open
      steps:
        - action: click
          element: 'research panel close button'
        - action: verify_elements
          elements:
            - selector: 'research side panel'
              expected: not_visible
              flexibility: exact
      success_criteria:
        - type: panel_closes
          flexibility: exact

# =============================================================================
# RESEARCH SUGGESTION TESTS
# Based on: Design doc Phase 10 - Research Suggestion System
# =============================================================================
research_suggestion:
  description: Test "Research this" suggestion feature

  scenarios:
    - id: SUGGEST-001
      name: Factual Question Shows Suggestion
      description: |
        Per design doc: "Factual questions show 'Research this' button"
        - Detect who, what, when, where, how many, etc.
      preconditions:
        - Send a factual question without research enabled
      steps:
        - action: navigate
          url: /chat
        - action: type
          element: 'textbox "Message input"'
          text: "Who is the current CEO of Microsoft?"
        - action: click
          element: 'button "Send message"'
        - action: wait_for
          condition: message_sent
          timeout: 5000
        - action: verify_elements
          elements:
            - selector: 'research suggestion button "Get current info"'
              expected: visible
              flexibility: ai_judgment
      success_criteria:
        - type: suggestion_appears
          flexibility: ai_judgment

    - id: SUGGEST-002
      name: Temporal Query Shows Suggestion
      description: |
        Per design doc: Detect "latest, recent, current, 2024, 2025, today"
      steps:
        - action: navigate
          url: /chat
        - action: type
          element: 'textbox "Message input"'
          text: "What are the latest developments in AI?"
        - action: click
          element: 'button "Send message"'
        - action: wait_for
          condition: response_received
          timeout: 60000
        - action: verify_elements
          elements:
            - selector: 'research suggestion button'
              expected: visible
              flexibility: ai_judgment
      success_criteria:
        - type: temporal_detected
          flexibility: ai_judgment

    - id: SUGGEST-003
      name: Click Research Suggestion
      description: |
        Per design doc: "Button click: enable research toggle, re-submit query"
      preconditions:
        - Message with research suggestion visible
      steps:
        - action: click
          element: 'research suggestion button "Get current info"'
        - action: wait_for
          condition: research_started
          timeout: 5000
        - action: verify
          condition: research_in_progress_or_complete
          flexibility: ai_judgment
      success_criteria:
        - type: suggestion_triggers_research
          flexibility: ai_judgment

# =============================================================================
# RESEARCH PAGE TESTS
# =============================================================================
research_page:
  description: Test the original research page functionality

  scenarios:
    - id: RSRCH-001
      name: Research Page Layout
      description: Verify research page components
      steps:
        - action: navigate
          url: /
        - action: verify_elements
          elements:
            - selector: 'textbox for research query'
              expected: visible
              flexibility: ai_judgment
            - selector: 'button "Research"'
              expected: visible
              flexibility: exact
            - selector: 'history section'
              expected: visible
              flexibility: ai_judgment
      success_criteria:
        - type: layout_correct
